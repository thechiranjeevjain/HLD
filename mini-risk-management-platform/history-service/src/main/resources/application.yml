server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: history-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/history}
    username: ${SPRING_DATASOURCE_USERNAME:risk}
    password: ${SPRING_DATASOURCE_PASSWORD:risk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:history-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.risk.common
        spring.json.value.default.type: com.example.risk.common.OrderEvent
        spring.json.use.type.headers: false

app:
  kafka:
    topics:
      order-events: ${ORDER_EVENTS_TOPIC:order-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

