name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  maven-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  docker-build:
    runs-on: ubuntu-latest
    needs: maven-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose syntax check
        run: docker compose config

      - name: Build service images
        run: |
          docker build -f api-gateway/Dockerfile -t mini-risk/api-gateway:ci .
          docker build -f order-service/Dockerfile -t mini-risk/order-service:ci .
          docker build -f risk-service/Dockerfile -t mini-risk/risk-service:ci .
          docker build -f history-service/Dockerfile -t mini-risk/history-service:ci .
          docker build -f notification-service/Dockerfile -t mini-risk/notification-service:ci .

