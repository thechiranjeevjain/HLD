spring:
  application.name: reliable-order-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DATABASE_USER:orders}
    password: ${DATABASE_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/orders}
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/orders/protocol/openid-connect/certs}
server:
  shutdown: graceful
  tomcat.threads.max: ${HTTP_MAX_THREADS:100}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics,loggers
  endpoint.health.probes.enabled: true
  health:
    readinessstate.enabled: true
    livenessstate.enabled: true
  metrics.tags.application: ${spring.application.name}
logging.pattern.console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","traceId":"%X{traceId:-}","message":"%replace(%msg){''"'',''\\"''}"}%n'
