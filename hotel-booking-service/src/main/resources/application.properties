spring.application.name=booking
server.shutdown=graceful
spring.datasource.url=jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.sql.init.mode=always

spring.cache.type=simple
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
booking.kafka.enabled=${BOOKING_KAFKA_ENABLED:false}
booking.kafka.hotel-events-topic=${BOOKING_HOTEL_EVENTS_TOPIC:hotel-events}

booking.security.user.username=${BOOKING_USER_USERNAME:user}
booking.security.user.password=${BOOKING_USER_PASSWORD:password}
booking.security.admin.username=${BOOKING_ADMIN_USERNAME:admin}
booking.security.admin.password=${BOOKING_ADMIN_PASSWORD:admin}

management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.metrics.tags.application=${spring.application.name}
info.app.name=${spring.application.name}
info.app.description=Hotel booking API practice project

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
