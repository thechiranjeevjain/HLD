services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: task_scheduler
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
    ports:
      - "5437:5432"
    volumes:
      - task-scheduler-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d task_scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_scheduler
      SPRING_DATASOURCE_USERNAME: capstone
      SPRING_DATASOURCE_PASSWORD: capstone
    ports:
      - "8085-8087:8085"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  task-scheduler-data:
