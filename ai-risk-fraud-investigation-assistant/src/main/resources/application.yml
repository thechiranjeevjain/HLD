server:
  port: ${SERVER_PORT:8080}
spring:
  application.name: ai-risk-fraud-assistant
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/fraud;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener.auto-startup: ${KAFKA_ENABLED:false}
  flyway.enabled: true
management:
  endpoints.web.exposure.include: health,info,prometheus
  tracing.sampling.probability: 1.0
app:
  jwt-secret: ${JWT_SECRET:local-interview-secret-key-that-is-at-least-32-bytes}
  mock-llm: ${MOCK_LLM:true}
  kafka-enabled: ${KAFKA_ENABLED:false}
