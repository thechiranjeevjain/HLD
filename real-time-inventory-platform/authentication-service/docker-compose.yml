services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
    ports:
      - "5433:5432"
    volumes:
      - auth-service-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d auth_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service
      SPRING_DATASOURCE_USERNAME: capstone
      SPRING_DATASOURCE_PASSWORD: capstone
      APP_JWT_SECRET: local-development-secret-with-at-least-thirty-two-bytes
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  auth-service-data:
