server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: distributed-task-scheduler
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/task_scheduler}
    username: ${SPRING_DATASOURCE_USERNAME:capstone}
    password: ${SPRING_DATASOURCE_PASSWORD:capstone}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  worker:
    fixed-delay-ms: ${APP_WORKER_FIXED_DELAY_MS:3000}
