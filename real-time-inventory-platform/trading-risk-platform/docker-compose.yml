services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riskdb
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d riskdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  history-service:
    build:
      context: .
      args:
        MODULE: history-service
    image: trading-risk/history-service:local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: riskdb
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  risk-service:
    build:
      context: .
      args:
        MODULE: risk-service
    image: trading-risk/risk-service:local
    environment:
      HISTORY_SERVICE_BASE_URL: http://history-service:8082
      RISK_MAX_ORDER_NOTIONAL: "500000"
      RISK_MAX_DAILY_EXPOSURE: "2500000"
      RISK_MAX_ORDER_QUANTITY: "10000"
      RISK_ALLOWED_SYMBOLS: AAPL,AMZN,GOOG,MSFT,NVDA,TSLA
    ports:
      - "8081:8081"
    mem_limit: 256m
    depends_on:
      history-service:
        condition: service_started

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    image: trading-risk/notification-service:local
    ports:
      - "8083:8083"

  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    image: trading-risk/order-service:local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: riskdb
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      RISK_SERVICE_BASE_URL: http://risk-service:8081
      HISTORY_SERVICE_BASE_URL: http://history-service:8082
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8083
      LARGE_ORDER_ALERT_NOTIONAL: "1000000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      history-service:
        condition: service_started
      risk-service:
        condition: service_started
      notification-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    image: trading-risk/api-gateway:local
    environment:
      ORDER_SERVICE_BASE_URL: http://order-service:8080
      HISTORY_SERVICE_BASE_URL: http://history-service:8082
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8083
    ports:
      - "8084:8084"
    depends_on:
      order-service:
        condition: service_started
      history-service:
        condition: service_started
      notification-service:
        condition: service_started

volumes:
  postgres-data:
