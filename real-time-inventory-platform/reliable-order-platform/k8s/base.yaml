apiVersion: v1
kind: Namespace
metadata: { name: order-platform }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: order-platform, namespace: order-platform }
data:
  DATABASE_URL: jdbc:postgresql://postgres.example:5432/orders
  REDIS_HOST: redis.example
  KAFKA_BOOTSTRAP_SERVERS: kafka.example:9092
  OIDC_ISSUER_URI: https://identity.example/realms/orders
  OIDC_JWK_SET_URI: https://identity.example/realms/orders/protocol/openid-connect/certs
---
apiVersion: v1
kind: Secret
metadata: { name: order-platform, namespace: order-platform }
type: Opaque
stringData: { DATABASE_USER: replace-via-external-secrets, DATABASE_PASSWORD: replace-via-external-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-platform, namespace: order-platform }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: order-platform } }
  template:
    metadata: { labels: { app: order-platform } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/example/reliable-order-platform:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: order-platform } }, { secretRef: { name: order-platform } }]
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 10 }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, failureThreshold: 30, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: order-platform, namespace: order-platform }
spec: { selector: { app: order-platform }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-platform
  namespace: order-platform
  annotations: { nginx.ingress.kubernetes.io/proxy-read-timeout: "10", nginx.ingress.kubernetes.io/limit-rps: "100" }
spec:
  ingressClassName: nginx
  rules: [{ host: orders.example.com, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: order-platform, port: { number: 80 } } } }] } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: order-platform, namespace: order-platform }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-platform }
  minReplicas: 2
  maxReplicas: 10
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: order-platform, namespace: order-platform }
spec: { minAvailable: 1, selector: { matchLabels: { app: order-platform } } }
