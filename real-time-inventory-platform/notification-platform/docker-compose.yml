services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
    ports:
      - "5436:5432"
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifications
      SPRING_DATASOURCE_USERNAME: capstone
      SPRING_DATASOURCE_PASSWORD: capstone
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  notification-data:
