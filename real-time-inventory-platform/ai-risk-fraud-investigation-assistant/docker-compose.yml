services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: fraud, POSTGRES_USER: fraud, POSTGRES_PASSWORD: fraud}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fraud"], interval: 5s, timeout: 3s, retries: 15}
    ports: ["5432:5432"]
  redis: {image: redis:7-alpine, ports: ["6379:6379"]}
  kafka:
    image: bitnami/kafka:3.9
    environment: {KAFKA_CFG_NODE_ID: 1, KAFKA_CFG_PROCESS_ROLES: broker,controller, KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093", KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093", KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092", KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER}
  backend:
    build: .
    environment: {DATABASE_URL: "jdbc:postgresql://postgres:5432/fraud", DATABASE_USERNAME: fraud, DATABASE_PASSWORD: fraud, KAFKA_BOOTSTRAP_SERVERS: "kafka:9092", KAFKA_ENABLED: "true", MOCK_LLM: "true"}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8080:8080"]
  frontend: {build: ./frontend, depends_on: [backend], ports: ["3000:80"]}
  prometheus: {image: prom/prometheus:v3.5.0, volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"], ports: ["9090:9090"]}
  grafana: {image: grafana/grafana:12.1.0, ports: ["3001:3000"]}
