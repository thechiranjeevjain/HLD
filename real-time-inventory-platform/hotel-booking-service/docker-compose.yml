services:
  app:
    build: .
    image: booking:local
    ports:
      - "8080:8080"
    environment:
      SPRING_CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BOOKING_KAFKA_ENABLED: "true"
      BOOKING_USER_USERNAME: user
      BOOKING_USER_PASSWORD: password
      BOOKING_ADMIN_USERNAME: admin
      BOOKING_ADMIN_PASSWORD: admin
      OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      - redis
      - kafka
      - otel-collector

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

volumes:
  redis-data:
  kafka-data:
