spring.datasource.url=jdbc:h2:mem:bookingtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.cache.type=simple
spring.data.redis.repositories.enabled=false
booking.kafka.enabled=false
booking.security.user.username=user
booking.security.user.password=password
booking.security.admin.username=admin
booking.security.admin.password=admin
management.otlp.tracing.export.enabled=false
