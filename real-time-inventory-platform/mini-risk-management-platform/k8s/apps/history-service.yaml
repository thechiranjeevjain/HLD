apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-service
  namespace: mini-risk
  labels:
    app: history-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: history-service
  template:
    metadata:
      labels:
        app: history-service
    spec:
      containers:
        - name: history-service
          image: mini-risk/history-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: mini-risk-config
            - secretRef:
                name: mini-risk-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/history
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: history-service
  namespace: mini-risk
spec:
  selector:
    app: history-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: history-service-hpa
  namespace: mini-risk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: history-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

