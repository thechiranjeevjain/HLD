server:
  port: 8084

spring:
  application:
    name: api-gateway

services:
  order:
    base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8080}
  history:
    base-url: ${HISTORY_SERVICE_BASE_URL:http://localhost:8082}
  notification:
    base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
