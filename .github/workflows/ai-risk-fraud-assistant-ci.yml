name: AI risk fraud assistant CI

on:
  push:
    paths: ["ai-risk-fraud-investigation-assistant/**", ".github/workflows/ai-risk-fraud-assistant-ci.yml"]
  pull_request:
    paths: ["ai-risk-fraud-investigation-assistant/**", ".github/workflows/ai-risk-fraud-assistant-ci.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-risk-fraud-investigation-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21, cache: maven}
      - run: mvn verify
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-risk-fraud-investigation-assistant/frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: ai-risk-fraud-investigation-assistant/frontend
      - run: docker compose config --quiet
      - run: docker build -t fraud-assistant:${{ github.sha }} .
