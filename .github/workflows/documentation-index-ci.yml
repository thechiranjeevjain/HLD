name: Documentation index CI

on:
  push:
  pull_request:

jobs:
  verify-generated-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:index:check
      - run: npm run docs:code-flow:check
