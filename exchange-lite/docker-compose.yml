services:
  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    environment:
      EXCHANGE_DATA_PORT: "9090"
      EXCHANGE_IPC_PORT: "9191"
    ports:
      - "9090:9090"
      - "9191:9191"

  sidecar:
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    environment:
      EXCHANGE_SIDECAR_PORT: "8080"
      EXCHANGE_IPC_HOST: "engine"
      EXCHANGE_IPC_PORT: "9191"
    ports:
      - "8080:8080"
    depends_on:
      - engine
