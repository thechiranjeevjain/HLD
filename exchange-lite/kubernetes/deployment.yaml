apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange-lite
  namespace: exchange-lite
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: exchange-lite
  template:
    metadata:
      labels:
        app: exchange-lite
    spec:
      containers:
        - name: engine
          image: exchange-lite-engine:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: exchange-lite-config
            - secretRef:
                name: exchange-lite-secrets
                optional: true
          ports:
            - name: data
              containerPort: 9090
            - name: ipc
              containerPort: 9191
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 9191
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: sidecar
          image: exchange-lite-sidecar:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: exchange-lite-config
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
