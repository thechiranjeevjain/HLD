apiVersion: v1
kind: ConfigMap
metadata: { name: cloud-agent-config }
data: { LLM_PROVIDER: fake, DATABASE_URL: "jdbc:postgresql://postgres:5432/agent" }
---
apiVersion: v1
kind: Secret
metadata: { name: cloud-agent-secrets }
type: Opaque
stringData: { DATABASE_PASSWORD: replace-me, OPENAI_API_KEY: replace-me }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
 replicas: 2
 selector: { matchLabels: { app: backend } }
 template:
  metadata: { labels: { app: backend } }
  spec:
   securityContext: { runAsNonRoot: true }
   containers:
   - name: backend
     image: example/cloud-agent-backend:latest
     ports: [{ containerPort: 8080 }]
     envFrom: [{ configMapRef: { name: cloud-agent-config } }, { secretRef: { name: cloud-agent-secrets } }]
     resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { cpu: "1", memory: 1Gi } }
     readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 20 }
     livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 40 }
---
apiVersion: v1
kind: Service
metadata: { name: backend }
spec: { selector: { app: backend }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec:
 replicas: 2
 selector: { matchLabels: { app: frontend } }
 template:
  metadata: { labels: { app: frontend } }
  spec:
   containers:
   - { name: frontend, image: example/cloud-agent-frontend:latest, ports: [{ containerPort: 3000 }], resources: { limits: { cpu: 250m, memory: 128Mi } } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec: { selector: { app: frontend }, ports: [{ port: 80, targetPort: 3000 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: cloud-agent }
spec: { rules: [{ host: cloud-agent.example.com, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }] } }] }
