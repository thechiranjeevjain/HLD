plugins { id 'java'; id 'org.springframework.boot'; id 'io.spring.dependency-management' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
 implementation 'org.springframework.boot:spring-boot-starter-web'
 implementation 'org.springframework.boot:spring-boot-starter-websocket'
 implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
 implementation 'org.springframework.boot:spring-boot-starter-validation'
 implementation 'org.springframework.boot:spring-boot-starter-actuator'
 implementation 'org.springframework.boot:spring-boot-starter-security'
 implementation 'org.flywaydb:flyway-core'; implementation 'org.flywaydb:flyway-database-postgresql'
 runtimeOnly 'org.postgresql:postgresql'; runtimeOnly 'com.h2database:h2'
 testImplementation 'org.springframework.boot:spring-boot-starter-test'; testImplementation 'org.springframework.security:spring-security-test'
}
tasks.named('test') { useJUnitPlatform() }
