apiVersion: apps/v1
kind: Deployment
metadata: {name: ptr-risk}
spec:
  replicas: 2
  selector: {matchLabels: {app: ptr-risk}}
  template:
    metadata: {labels: {app: ptr-risk}}
    spec:
      containers:
        - name: engine
          image: ptr-risk:local
          ports: [{containerPort: 8090}]
          resources: {requests: {cpu: "500m", memory: 512Mi}, limits: {cpu: "2", memory: 1Gi}}
          readinessProbe: {httpGet: {path: /actuator/health, port: 8090}, initialDelaySeconds: 5}
        - name: nff-management
          image: ptr-sidecar:local
          env: [{name: ENGINE_URL, value: "http://localhost:8090"}]
          ports: [{containerPort: 8091}]
---
apiVersion: v1
kind: Service
metadata: {name: ptr-risk-management}
spec: {selector: {app: ptr-risk}, ports: [{name: sidecar, port: 8091, targetPort: 8091}]}

