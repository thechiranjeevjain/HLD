services:
  engine:
    build: {context: .., dockerfile: pretrade-risk-engine/Dockerfile}
    command: ["--spring.profiles.active=demo"]
    ports: ["8090:8090"]
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health"], interval: 5s, timeout: 2s, retries: 12}
  nff-sidecar:
    build: ./sidecar
    environment: {ENGINE_URL: "http://engine:8090"}
    ports: ["8091:8091"]
    depends_on: {engine: {condition: service_healthy}}
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment: {GF_SECURITY_ADMIN_PASSWORD: "admin", GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"}
    depends_on: [prometheus]

