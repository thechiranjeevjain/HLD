server:
  port: 8082

spring:
  application:
    name: history-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:riskdb}
    username: ${POSTGRES_USER:risk}
    password: ${POSTGRES_PASSWORD:risk}
  flyway:
    locations: classpath:db/migration
    table: history_flyway_schema_history
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
