server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:riskdb}
    username: ${POSTGRES_USER:risk}
    password: ${POSTGRES_PASSWORD:risk}
  flyway:
    locations: classpath:db/migration
    table: order_flyway_schema_history
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

services:
  risk:
    base-url: ${RISK_SERVICE_BASE_URL:http://localhost:8081}
  history:
    base-url: ${HISTORY_SERVICE_BASE_URL:http://localhost:8082}
  notification:
    base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8083}

alerts:
  large-order-notional: ${LARGE_ORDER_ALERT_NOTIONAL:1000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
