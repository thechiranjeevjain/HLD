services:
  app:
    build: .
    ports: ["8095:8095"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      SPRING_DATASOURCE_USERNAME: ledger
      SPRING_DATASOURCE_PASSWORD: ledger
      SPRING_SQL_INIT_MODE: always
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: ledger, POSTGRES_USER: ledger, POSTGRES_PASSWORD: ledger}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ledger"], interval: 5s, timeout: 3s, retries: 10}
    volumes: ["ledger-data:/var/lib/postgresql/data"]
volumes: {ledger-data: {}}

